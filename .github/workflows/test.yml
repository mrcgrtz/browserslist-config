name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [lts/*, latest]
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Test
              run: npm test
